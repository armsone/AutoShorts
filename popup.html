<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자동쇼츠</title>
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
        background: #f5f5f5;
      }
      .card {
        border-radius: 12px;
        border: 1px solid #ddd;
        background: white;
        padding: 12px;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        font-weight: 700;
        color: white;
        background: #e51d25;
        cursor: pointer;
      }
      .off {
        background: #8c8c8c;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="icons/icon-48.png" alt="" />
        <h2 style="margin:0; font-size:16px; color:#111;">자동쇼츠</h2>
      </div>
      <button id="toggleBtn">로딩중…</button>
      <div id="status">현재 상태: 확인 중</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
