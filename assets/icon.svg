<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">자동쇼츠</title>
  <desc id="desc">재생이 끝나면 다음 쇼츠로 부드럽게 이어지는 표시</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0" />
      <stop offset="1" stop-color="#fdf0da" />
    </linearGradient>
    <linearGradient id="arrowStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4e" />
      <stop offset="0.5" stop-color="#e41e25" />
      <stop offset="1" stop-color="#c8151b" />
    </linearGradient>
    <linearGradient id="triangleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4e" />
      <stop offset="0.5" stop-color="#e41e25" />
      <stop offset="1" stop-color="#c8151b" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#background)" />
  <rect x="34" y="34" width="444" height="444" rx="104" fill="none" stroke="#ffffff" stroke-width="6" />

  <!-- Circular forward arrow, red with bright chrome outline -->
  <path d="M256 96a160 160 0 1 1 -113 273" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round" />
  <path d="M256 96a160 160 0 1 1 -113 273" fill="none" stroke="url(#arrowStroke)" stroke-width="42" stroke-linecap="round" />
  <path d="M228 78l58 30-18 62z" fill="#ffffff" />
  <path d="M228 78l58 30-18 62z" fill="url(#arrowStroke)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />

  <!-- Centered play triangle -->
  <path d="M210 176c0-14 15-23 27-15l112 70c12 8 12 26 0 34l-112 70c-12 8-27-1-27-15z" fill="#ffffff" />
  <path d="M216 182c0-11 12-18 22-12l100 62c10 6 10 20 0 26l-100 62c-10 6-22-1-22-12z" fill="url(#triangleFill)" />
</svg>
